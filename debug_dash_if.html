        (() => {
            console.log("Installing global <video> prototype spy");

            /* -------------------------
               Spy src property
            ------------------------- */

            const srcDesc = Object.getOwnPropertyDescriptor(HTMLMediaElement.prototype, "src");

            Object.defineProperty(HTMLMediaElement.prototype, "src", {
                get: function () {
                    return srcDesc.get.call(this);
                },
                set: function (value) {
                    console.group("VIDEO src set");
                    console.log("element:", this);
                    console.log("new src:", value);
                    console.log("stack:", new Error().stack);
                    console.groupEnd();
                    return srcDesc.set.call(this, value);
                }
            });

            /* -------------------------
               Spy load()
            ------------------------- */

            const originalLoad = HTMLMediaElement.prototype.load;

            HTMLMediaElement.prototype.load = function (...args) {
                console.group("VIDEO load() called");
                console.log("element:", this);
                console.log("currentSrc:", this.currentSrc);
                console.log("src:", this.src);
                console.log("stack:", new Error().stack);
                console.groupEnd();

                return originalLoad.apply(this, args);
            };

            /* -------------------------
               Spy appendChild for <source>
            ------------------------- */

            const originalAppendChild = HTMLMediaElement.prototype.appendChild;

            HTMLMediaElement.prototype.appendChild = function (node) {
                if (node && node.tagName === "SOURCE") {
                    console.group("SOURCE appended to VIDEO");
                    console.log("video:", this);
                    console.log("source src:", node.src || node.getAttribute("src"));
                    console.log("source type:", node.type);
                    console.log("stack:", new Error().stack);
                    console.groupEnd();
                }

                return originalAppendChild.call(this, node);
            };

            /* -------------------------
               Spy setAttribute
            ------------------------- */

            const originalSetAttribute = Element.prototype.setAttribute;

            Element.prototype.setAttribute = function (name, value) {
                if (this instanceof HTMLMediaElement && name === "src") {
                    console.group("VIDEO setAttribute('src')");
                    console.log("element:", this);
                    console.log("value:", value);
                    console.log("stack:", new Error().stack);
                    console.groupEnd();
                }

                if (this.tagName === "SOURCE" && name === "src") {
                    console.group("SOURCE src attribute set");
                    console.log("source:", this);
                    console.log("value:", value);
                    console.log("parent video:", this.parentElement);

            max-width: 700px;
            padding: 8px;
            font-size: 15px;
            border: 2px solid #888;
            border-radius: 4px;
            box-sizing: border-box;
        }

        button {
            padding: 10px 28px;
            font-size: 16px;
            border: 2px solid #333;
            border-radius: 4px;
            background: #eee;
            cursor: pointer;
            margin-right: 10px;
        }

        video {
            display: block;
            margin-top: 16px;
            max-width: 100%;
        }

        pre#log {
            margin-top: 12px;
            background: #f4f4f4;
            border: 1px solid #ccc;
            padding: 8px;
            max-height: 200px;
            overflow: auto;
            font-size: 12px;
        }
    </style>

</head>

<body>

    <h2>Dash.js – Widevine DRM</h2>

    <div>
        <label for="manifestUrl">Manifest url :</label>
        <input id="manifestUrl" type="text"
            value="https://storage.googleapis.com/shaka-demo-assets/angel-one-widevine/dash.mpd">
    </div>

    <br>

    <div>
        <label for="licenseUrl">License server URL :</label>
        <input id="licenseUrl" type="text" value="https://cwip-shaka-proxy.appspot.com/no_auth">
    </div>

    <br>

    <button id="loadBtn">Load</button>
    <button id="stopBtn">Stop</button>

    <br>

    <video id="video" width="854" height="480" controls></video>

    <br>

    <pre id="log"></pre>

    <script type="module">

        var logEl = document.getElementById('log');

        function log(msg) {
            var line = '[' + new Date().toISOString() + '] ' + msg;
            console.log(line);
            logEl.textContent += line + '\n';
            logEl.scrollTop = logEl.scrollHeight;
        }

        var player = null;
        var video = document.getElementById("video");

        function initDash() {

            player = dashjs.MediaPlayer().create();

            player.updateSettings({
                debug: {
                    logLevel: dashjs.Debug.LOG_LEVEL_DEBUG
                }
            });

            player.on(dashjs.MediaPlayer.events.ERROR, function (e) {
                log("Error : " + JSON.stringify(e));
            });

            log("Dash.js initialized");
        }

        function loadStream() {

            var manifestUrl = document.getElementById("manifestUrl").value;
            var licenseUrl = document.getElementById("licenseUrl").value;

            if (!manifestUrl) {
                log("Error : no manifest url");
                return;
            }

            if (!licenseUrl) {
                log("Error : no license url");
                return;
            }

            try {
                player.reset();
            } catch (e) { }

            player = dashjs.MediaPlayer().create();

            var protectionData = {

                "com.widevine.alpha": {
                    serverURL: licenseUrl
                }

            };

            player.setProtectionData(protectionData);

            player.registerCustomCapabilitiesFilter(function (representation) {
                if (representation.mimeType === "video/webm") {
                    return false;
                }

                if (representation.codecs && representation.codecs.includes("vp09")) {
                    return false;
                }

                return true;
            });

            player.initialize(video, manifestUrl, true);

            log("Content loading...");
        }

        function stopStream() {

            if (!player) return;

            try {
                player.reset();
                log("Content stopped");
            } catch (e) {
                log("Stop error : " + e);
            }

        }

        document.getElementById("loadBtn").addEventListener("click", loadStream);
        document.getElementById("stopBtn").addEventListener("click", stopStream);

        initDash();

    </script>

</body>

</html>
