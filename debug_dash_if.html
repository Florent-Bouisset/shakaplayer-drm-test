<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dash.js – Widevine DRM</title>




    <script src="https://cdn.jsdelivr.net/npm/dashjs@4/dist/modern/esm/dash.all.debug.js"></script>

    <style>
        body {
            font-family: sans-serif;
            font-size: 16px;
            margin: 20px;
            background-color: #d8d8d8;
        }

        label {
            display: block;
            margin-bottom: 4px;
            font-weight: bold;
        }

        input[type="text"] {
            display: block;
            width: 100%;
            max-width: 700px;
            padding: 8px;
            font-size: 15px;
            border: 2px solid #888;
            border-radius: 4px;
            box-sizing: border-box;
        }

        button {
            padding: 10px 28px;
            font-size: 16px;
            border: 2px solid #333;
            border-radius: 4px;
            background: #eee;
            cursor: pointer;
            margin-right: 10px;
        }

        video {
            display: block;
            margin-top: 16px;
            max-width: 100%;
        }

        pre#log {
            margin-top: 12px;
            background: #f4f4f4;
            border: 1px solid #ccc;
            padding: 8px;
            max-height: 200px;
            overflow: auto;
            font-size: 12px;
        }
    </style>

</head>

<body>

    <h2>Dash.js – Widevine DRM</h2>

    <div>
        <label for="manifestUrl">Manifest url :</label>
        <input id="manifestUrl" type="text"
            value="https://storage.googleapis.com/shaka-demo-assets/angel-one-widevine/dash.mpd">
    </div>

    <br>

    <div>
        <label for="licenseUrl">License server URL :</label>
        <input id="licenseUrl" type="text" value="https://cwip-shaka-proxy.appspot.com/no_auth">
    </div>

    <br>

    <button id="loadBtn">Load</button>
    <button id="stopBtn">Stop</button>

    <br>

    <video id="video" width="854" height="480" controls></video>

    <br>

    <pre id="log"></pre>

    <script>

        var logEl = document.getElementById('log');

        function log(msg) {
            var line = '[' + new Date().toISOString() + '] ' + msg;
            console.log(line);
            logEl.textContent += line + '\n';
            logEl.scrollTop = logEl.scrollHeight;
        }

        var player = null;
        var video = document.getElementById("video");

        function initDash() {

            player = dashjs.MediaPlayer().create();

            player.updateSettings({
                debug: {
                    logLevel: dashjs.Debug.LOG_LEVEL_DEBUG
                }
            });

            player.on(dashjs.MediaPlayer.events.ERROR, function (e) {
                log("Error : " + JSON.stringify(e));
            });

            log("Dash.js initialized");
        }

        function loadStream() {

            var manifestUrl = document.getElementById("manifestUrl").value;
            var licenseUrl = document.getElementById("licenseUrl").value;

            if (!manifestUrl) {
                log("Error : no manifest url");
                return;
            }

            if (!licenseUrl) {
                log("Error : no license url");
                return;
            }

            try {
                player.reset();
            } catch (e) { }

            player = dashjs.MediaPlayer().create();

            var protectionData = {

                "com.widevine.alpha": {
                    serverURL: licenseUrl
                }

            };

            player.setProtectionData(protectionData);

            player.initialize(video, manifestUrl, true);

            log("Content loading...");
        }

        function stopStream() {

            if (!player) return;

            try {
                player.reset();
                log("Content stopped");
            } catch (e) {
                log("Stop error : " + e);
            }

        }

        document.getElementById("loadBtn").addEventListener("click", loadStream);
        document.getElementById("stopBtn").addEventListener("click", stopStream);

        initDash();

    </script>

</body>

</html>
